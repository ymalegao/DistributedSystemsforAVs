syntax = "proto3";

package veins.resdb;

// ── Vehicle state broadcast (replaces BFTMessage ARRIVAL_ANNOUNCE payload) ──

message VehicleState {
  int32  replica_id      = 1;  // matches replicaId NED param
  double pos_x           = 2;  // SUMO x-coordinate (metres)
  double pos_y           = 3;  // SUMO y-coordinate (metres)
  double speed_mps       = 4;
  string lane_id         = 5;  // SUMO lane string, e.g. ":-1_0"
  string intended_dir    = 6;  // "S" | "L" | "R"
  bool   is_ambulance    = 7;
  uint64 sim_time_us     = 8;  // simTime() in microseconds (integer, deterministic)
}

// ── Reservation request (client → ResilientDB replicas) ──────────────────────

message ReservationRequest {
  int32        replica_id   = 1;
  VehicleState state        = 2;
  uint32       epoch        = 3;  // arrival epoch (monotone counter per replica)
  bytes        signature    = 4;  // EC signature over canonical(state + epoch)
}

// ── Arrival certificate (f+1 echoes bundled together) ────────────────────────

message ArrivalCertificate {
  int32                  announcing_replica = 1;
  repeated EchoEntry     echoes             = 2;  // must have >= f+1 entries

  message EchoEntry {
    int32 witness_replica = 1;
    bytes signature       = 2;
  }
}

// ── PROPOSE_ALL payload (leader → BFT ordering layer) ────────────────────────

message ProposeAllPayload {
  uint32                      epoch               = 1;
  repeated ArrivalCertificate certs               = 2;  // one per participating vehicle
  int32                       leader_id           = 3;
  uint64                      propose_sim_time_us = 4;
  repeated VehicleState       vehicle_states      = 5;  // Step 5: direct states for ordering
}

// ── ORDER decision (ResilientDB execute callback → OMNeT++) ──────────────────

message OrderDecision {
  uint32           epoch           = 1;
  repeated int32   crossing_order  = 2;  // replica_id in crossing sequence
  uint64           decided_sim_time_us = 3;
}
