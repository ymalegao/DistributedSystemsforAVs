syntax = "proto3";

package bftconsensus;
option go_package = "github.com/ymalegao/DistributedSystemsforAVs/pb/bftconsensus;bftconsensus";

// --- Shared types (you can reuse VehicleMeta) ---

enum BFTElectionStatus { BFT_INIT_CANDIDATE = 0; BFT_FIN_CANDIDATE = 1; BFT_FOLLOWER = 2; BFT_LEADER = 3; }

message BFTVehicleMeta {
  string id = 1;
  string plate = 2;
  string direction = 3;              // "N-left", "E-straight", ...
  BFTElectionStatus status = 4;
  uint32 sent_votes = 5;             // optional for debugging/metrics
  uint32 received_votes = 6;         // optional for debugging/metrics
  int64  election_time_ms = 7;       // first-ACK (or support) time
}

// Phases for attestation/QC
enum Phase { PHASE_UNSPECIFIED = 0; PHASE1_VOTE = 1; PHASE2_LEADER = 2; }

// A single signer’s attestation (signature over canonical tuple)
message Attestation {
  uint64 view = 1;                   // epoch/term
  Phase  phase = 2;                  // PHASE1_VOTE or PHASE2_LEADER
  string subject_id = 3;             // candidate being supported
  bytes  payload_hash = 4;           // H( payload )
  string signer_id = 5;              // who signed
  bytes  sig = 6;                    // ed25519 signature over canonical bytes
}

// A quorum certificate = ≥ 2f+1 attestations over SAME (view,phase,subject,payload_hash)
message QuorumCert {
  uint64 view = 1;
  Phase  phase = 2;
  string subject_id = 3;
  bytes  payload_hash = 4;
  repeated Attestation sigs = 5;     // distinct signer_id; size >= 2f+1
}

// ---------- PHASE 1 (VOTE → QC1) ----------

// SEND: carries full payload (meta); signed by sender
message SendVote {
  uint64 view = 1;
  string subject_id = 2;             // candidate id
  BFTVehicleMeta payload = 3;           // meta(subject)
  Attestation sender_att = 4;        // signature over (view, PHASE1_VOTE, subject_id, H(payload), signer=sender_id)
}

// ECHO/READY: carry only the payload hash + signer’s attestation
message EchoVote {
  uint64 view = 1;
  string subject_id = 2;
  bytes  payload_hash = 3;
  Attestation att = 4;               // signer’s ECHO attestation
}

message ReadyVote {
  uint64 view = 1;
  string subject_id = 2;
  bytes  payload_hash = 3;
  Attestation att = 4;               // signer’s READY attestation
}

// ---------- PHASE 2 (LEADER → QC2) ----------

// SEND: carries {meta(subject), QC1}
message SendLeader {
  uint64 view = 1;
  string subject_id = 2;
  BFTVehicleMeta fin_meta = 3;          // meta(subject)
  QuorumCert qc1 = 4;                // proof of Phase-1
  Attestation sender_att = 5;        // signature over (view, PHASE2_LEADER, subject_id, H(fin_meta||qc1), signer=sender_id)
}

message EchoLeader {
  uint64 view = 1;
  string subject_id = 2;
  bytes  payload_hash = 3;           // H(fin_meta||qc1)
  Attestation att = 4;               // signer’s ECHO attestation
}

message ReadyLeader {
  uint64 view = 1;
  string subject_id = 2;
  bytes  payload_hash = 3;           // H(fin_meta||qc1)
  Attestation att = 4;               // signer’s READY attestation
}

// ---------- Streaming envelope ----------

message Wire {
  oneof kind {
    SendVote   send_vote   = 1;
    EchoVote   echo_vote   = 2;
    ReadyVote  ready_vote  = 3;

    SendLeader send_leader = 4;
    EchoLeader echo_leader = 5;
    ReadyLeader ready_leader = 6;
  }
}

message WireAck {
  bool ok = 1;                       // transport-level ack (not a vote)
  string reason = 2;                 // optional error/debug
}

// One bi-di stream per peer; you push Wire messages, they push acks (optional)
service BFTConsensus {
  rpc Gossip(stream Wire) returns (stream WireAck);
}


service BFTConsensusUnary {
  rpc ReceiveSendVote   (SendVote)   returns (WireAck);
  rpc ReceiveEchoVote   (EchoVote)   returns (WireAck);
  rpc ReceiveReadyVote  (ReadyVote)  returns (WireAck);

  rpc ReceiveSendLeader (SendLeader) returns (WireAck);
  rpc ReceiveEchoLeader (EchoLeader) returns (WireAck);
  rpc ReceiveReadyLeader(ReadyLeader)returns (WireAck);
}



