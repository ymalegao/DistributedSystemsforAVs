# ── Actuated traffic-light arm ────────────────────────────────────────────────
# The baseline arm for ablation 3: junction C typed traffic_light with an
# actuated program (netconvert --tls.set C --tls.default-type actuated).
# Vehicles run BaselineModule -- plain driving, no protocol -- so the signal,
# not the vehicles, decides right of way.
#
# Actuated rather than fixed-time on two grounds. The AIM surveys report
# fixed-time as the most-used comparison (46%) while explicitly calling for
# actuated or adaptive instead, and under this scenario's single arrival burst a
# fixed cycle would burn green on approaches that emptied and never refill --
# losing for a reason that has nothing to do with signal control. Actuated
# extends green while vehicles are present and ends it on a gap, so it serves a
# burst on its merits.
#
# The program has permissive left turns (lowercase g). Protected lefts are not
# achievable here: every approach has a single lane, so through and left share
# it and no phase can hold one red while the other runs. --tls.left-green.time
# was verified to produce a byte-identical program for that reason.

[Config tl4veh]
description = "Actuated traffic light on 4-vehicle routes"
*.manager.launchConfig = xmldoc("tl_4veh.launchd.xml")
*.node[*].applType = "src.BaselineModule"
*.node[*].appl.sendBeacons = false
*.node[*].appl.dataOnSch = false
*.node[*].appl.intersectionX = 300m
*.node[*].appl.intersectionY = 300m
*.manager.intersectionBatchSize = 4

