# pbftVcTimeoutSec sets the PBFT complaint timer; after this many sim-s the complaint fires VC.
*.node[*].appl.pbftVcTimeoutSec = 8s
*.node[*].appl.enableChannelMetricsCsv = true

*.node[*].appl.enableDecisionGossip              = true
