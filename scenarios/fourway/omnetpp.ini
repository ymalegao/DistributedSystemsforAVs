##########################################################
# Two-lane rollback arms
#
# The occupancy sensor behind the BLOCKED and CLEAR rollback triggers only runs
# under enableRollback. Every rollback config was single-lane and every two-lane
# config had rollback off, so on two lanes that code had nowhere to execute.
# These are that home.
#
# Deliberately a CONTROLLED PAIR with the single-lane arms: same N (16 base + 2
# TraCI-injected = 18, or 22 with units), same crypto dir, same f, same R0
# supervisor tuning, same vehicle dynamics (the route file copies its vTypes from
# bft_18veh_rollback_late.rou.xml, not from the other two-lane fixtures), and the
# same iu[*] coordinates. Only the network and the lane semantics differ, so a
# one-lane vs two-lane rollback difference is attributable to the lanes.
##########################################################

[Config EighteenVehTwoLaneRollbackNoUnits]
extends = EighteenVehRollbackNoUnits
description = "N=18 late-ambulance rollback on two lanes per approach, no units"
*.manager.launchConfig = xmldoc("resdb_bft_18veh_2lane_rollback_late.launchd.xml")

# Two lanes per approach, so a lane claim is checkable against a continuous
# lateral coordinate. 3.2 m is the network's real centreline separation and is
# validated against TraCI at init -- a mismatch throws rather than silently
# mis-projecting. Scoped to node[*] and NEVER to iu[*]: units have no
# TraCIMobility, and ResDBPerception::configure() derives the lane frame from
# mobility without a null guard.
*.node[*].appl.laneObservationMode     = "ADJACENT_LATERAL"
*.node[*].appl.adjacentLaneSeparationM = 3.2m

# stopDistance = 5 - 3.2/(N/2) with N = totalVehicles = 16, so 4.6m. The two-lane
# junction has a larger radius (289.60 m approaches, lanes ending 10.40 m from
# the centre rather than 7.20 m); left at 5m every vehicle would begin its stop
# zone 3.2 m further out than in the single-lane arm and every delay comparison
# would carry that confound.
#   single lane:  5.0 * (16/2) + 7.20  = 47.20 m from junction centre
#   two lane:     4.6 * (16/2) + 10.40 = 47.20 m
*.node[*].appl.stopDistance = 4.6m

# node[] indices follow lexicographic SUMO vehicle ids (veh0, veh1, veh10, ...),
# so node[i] is not veh i. bft_18veh_2lane_rollback_late.rou.xml keeps the
# sixteen-vehicle layout of bft_16veh_2lane.rou.xml unchanged, so this mapping is
# the same one SixteenVehiclesTwoLaneResDB derives; it was re-checked against the
# new route file rather than assumed. node[16]/node[17] are the TraCI-injected
# pair, which append in arrival order after the initial wave.
*.node[0].appl.intendedLane = "N"
*.node[0].appl.intendedDirection = "L"
*.node[1].appl.intendedLane = "N"
*.node[1].appl.intendedDirection = "S"
*.node[2].appl.intendedLane = "W"
*.node[2].appl.intendedDirection = "S"
*.node[3].appl.intendedLane = "W"
*.node[3].appl.intendedDirection = "R"
*.node[4].appl.intendedLane = "N"
*.node[4].appl.intendedDirection = "L"
*.node[5].appl.intendedLane = "S"
*.node[5].appl.intendedDirection = "L"
*.node[6].appl.intendedLane = "E"
*.node[6].appl.intendedDirection = "L"
*.node[7].appl.intendedLane = "W"
*.node[7].appl.intendedDirection = "L"
*.node[8].appl.intendedLane = "N"
*.node[8].appl.intendedDirection = "R"
*.node[9].appl.intendedLane = "S"
*.node[9].appl.intendedDirection = "L"
*.node[10].appl.intendedLane = "S"
*.node[10].appl.intendedDirection = "S"
*.node[11].appl.intendedLane = "S"
*.node[11].appl.intendedDirection = "R"
*.node[12].appl.intendedLane = "E"
*.node[12].appl.intendedDirection = "L"
*.node[13].appl.intendedLane = "E"
*.node[13].appl.intendedDirection = "S"
*.node[14].appl.intendedLane = "E"
*.node[14].appl.intendedDirection = "R"
*.node[15].appl.intendedLane = "W"
*.node[15].appl.intendedDirection = "L"

# The late pair: veh16 on route rN (N2C C2S, straight), veh17 the ambulance on
# route rE (E2C C2W, straight). Both are served from lane 0, which is what the
# supervisor's hardcoded DEPART_LANE_BEST will select.
*.node[16].appl.intendedLane = "N"
*.node[16].appl.intendedDirection = "S"
*.node[17].appl.intendedLane = "E"
*.node[17].appl.intendedDirection = "S"

