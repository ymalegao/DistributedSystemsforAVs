[General]
# Two streams, not one. RNG 0 is the protocol's and the scenario's; RNG 1 is
# perception's alone (see perceptionRngIndex). Keeping them apart is what lets
# the noise level be changed without shifting any draw that decides something
# else, so a measured difference is attributable to the sensor rather than to a
# reshuffled turn assignment.
num-rngs = 2
#scheduler-class = "omnetpp::cRealTimeScheduler"
#realtimescheduler-scaling = 1
cmdenv-express-mode = true
cmdenv-autoflush = false
cmdenv-status-frequency = 1s
**.cmdenv-log-level = info

image-path = ../../images

network = fourWay

##########################################################
#            Simulation parameters                       #
##########################################################
debug-on-errors = true
print-undisposed = true

sim-time-limit = 50000s

# Default PROPOSE_ALL leader; override per run with --leader via leader_override.ini
*.node[*].appl.leaderReplicaId = 0

**.scalar-recording = true
**.vector-recording = true

*.playgroundSizeX = 2500m
*.playgroundSizeY = 2500m
*.playgroundSizeZ = 50m


##########################################################
# Annotation parameters                                  #
##########################################################
*.annotations.draw = true

##########################################################
# Obstacle parameters                                    #
##########################################################
# *.obstacles.obstacles = xmldoc("config.xml", "//AnalogueModel[@type='SimpleObstacleShadowing']/obstacles")
*.obstacles.debug = false
