# 18-node identity overlay used by the generated rollback_late_emergency.ini.
# Scenario-specific R0 supervisor, launch, quorum, and rollback tuning lives in
# run-resdb-simulation.sh so the runner owns the experiment knobs.

# Replica IDs for the two late arrivals. The SUMO identity binding only overrides ids
# < totalVehicles, so veh16/veh17 keep these NED ids (valid because they spawn last,
# making node index == veh number).
*.node[16].appl.replicaId = 16
*.node[17].appl.replicaId = 17

# node-index -> SUMO veh -> lane mapping for the 18-vehicle route.
# node[0..15] are inherited from SixteenVehiclesResDB and remain correct because
# the veh->lane assignment is identical; only the two late arrivals are added:
#   node[16] = veh16 (rN, normal), node[17] = veh17 (rE, ambulance)
*.node[16].appl.intendedLane = "N"
*.node[17].appl.intendedLane = "E"




