[Config SixteenVehiclesTwoLaneResDB]
extends = SixteenVehiclesResDB
description = "N=16, two lanes per approach: lane 0 straight/right, lane 1 left"
*.manager.launchConfig = xmldoc("resdb_bft_16veh_2lane.launchd.xml")

# Two lanes per approach, so a lane claim is checkable against a continuous
# lateral coordinate rather than taken on trust. 3.2 m matches the network's
# actual centreline separation and is validated against TraCI at init -- a
# mismatch throws rather than silently mis-projecting.
*.node[*].appl.laneObservationMode     = "ADJACENT_LATERAL"
*.node[*].appl.adjacentLaneSeparationM = 3.2m

# Corrected so this arm is comparable with the single-lane one.
#
# The stop zone is measured from the lane END and scaled by totalVehicles/2
# (ResDBIntersectionApp.cc). The two-lane junction has a larger radius, so its
# approaches are 289.60 m rather than 292.80 m and lanes end 10.40 m from the
# centre rather than 7.20 m. Left at 5m, vehicles here would begin their stop
# zone 3.2 m further out than in the single-lane arm, and every delay and
# throughput comparison between the two would carry that confound -- the same
# one that already invalidates ablation 3's numbers.
#
#   single lane:  5.0 * (16/2) + 7.20  = 47.20 m from junction centre
#   two lane:     4.6 * (16/2) + 10.40 = 47.20 m
#
# General form: stopDistance = 5 - 3.2/(N/2). Recompute it for any other N.
*.node[*].appl.stopDistance = 4.6m

# node[] indices follow lexicographic SUMO vehicle ids (veh0, veh1, veh10, ...),
# so node[i] is not veh i. This mapping is derived from the route file and must
# be re-derived, never copied, if the routes change.
*.node[0].appl.intendedLane = "N"
*.node[0].appl.intendedDirection = "L"
*.node[1].appl.intendedLane = "N"
*.node[1].appl.intendedDirection = "S"
*.node[2].appl.intendedLane = "W"
