# Approach is read from the TraCI edge name, not declared per node.
#
# The per-node intendedLane mapping this replaces was wrong: it assumed NED node
# index equals vehicle number, but SUMO assigns modules in spawn order and
# bft_8veh.rou.xml lists vehicles as veh0, veh5, veh1, veh6, veh3, veh2, veh4,
# veh7. replicaId is rebound from the SUMO id at runtime; intendedLane is not,
# so five of eight vehicles declared a neighbour's approach. Honest witnesses
# then correctly refused to echo them, only three vehicles ever certified, and
# every N=8 cell in every study closed on the 8s hard deadline instead of
# normally -- which showed up as N=8 being anomalously slow in ab1 and ab7.
#
# Auto-detection has no mapping to get wrong. The other configs' mappings happen
# to be correct today, but they carry the same latent hazard.
[Config TwelveVehiclesResDB]
extends = ResDBBase
*.manager.launchConfig = xmldoc("resdb_bft_12veh.launchd.xml")
*.node[*].appl.totalVehicles = 12            # effective stop zone = 5 * 4 = 20m
*.manager.intersectionBatchSize = 12

# Assign replica IDs (0-11 for 12 nodes)

# Cardinal lanes must match bft_12veh.rou.xml per veh id (replicaId follows SUMO
# externalId when mobility is bound): veh0,veh5=N; veh1,veh6=S; veh3,veh2=E; veh4,veh7=W.
*.node[0].appl.intendedLane = "N"
*.node[1].appl.intendedLane = "S"
*.node[2].appl.intendedLane = "S"
*.node[3].appl.intendedLane = "E"
*.node[4].appl.intendedLane = "E"
*.node[5].appl.intendedLane = "W"
*.node[6].appl.intendedLane = "W"
*.node[7].appl.intendedLane = "N"
*.node[8].appl.intendedLane = "S"
*.node[9].appl.intendedLane = "E"
*.node[10].appl.intendedLane = "W"
*.node[11].appl.intendedLane = "N"


# ── Crypto directory (relative to fourway/ run dir) ───────────────────────────
*.node[*].appl.resdbCryptoDir = "resdb_crypto_12"   # must declare N replicas in server.config

# ── Step-3: radio transport (smoke test off in production) ───────────────────
*.node[*].appl.smokeTestBroadcast = false
*.node[*].appl.useRadioTransport = true

# ── Step-5: cert collection / proposal ───────────────────────────────────────
*.node[*].appl.certCollectionTimeoutSec = 8s
*.node[*].appl.stateAnnounceIntervalSec = 0.1s

# ── Step-5: crossing parameters ──────────────────────────────────────────────
*.node[*].appl.cruiseSpeedMps     = 14.0
*.node[*].appl.safetyGapS         = 1.5
# stopDistance is distance-to-lane-end threshold (TraCI-based); 20m is safe for 14 m/s approach
*.node[*].appl.stopDistance       = 5m
# intendedDirection: S=straight, L=left, R=right (all go straight in fourway)
*.node[*].appl.intendedDirection  = "S"

# Arrival cert protocol timings
