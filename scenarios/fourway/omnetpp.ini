*.iu[*].nic.mac1609_4.cwMin        = 3
*.iu[*].nic.mac1609_4.cwMax        = 15

# Units take replica IDs after the vehicles.
*.iu[0].appl.replicaId = 20
*.iu[1].appl.replicaId = 21
*.iu[2].appl.replicaId = 22
*.iu[3].appl.replicaId = 23

*.iu[0].mobility.x = 305
*.iu[0].mobility.y = 305
*.iu[0].mobility.z = 3
*.iu[1].mobility.x = 345
*.iu[1].mobility.y = 305
*.iu[1].mobility.z = 3
*.iu[2].mobility.x = 305
*.iu[2].mobility.y = 345
*.iu[2].mobility.z = 3
*.iu[3].mobility.x = 345
*.iu[3].mobility.y = 345
*.iu[3].mobility.z = 3

##########################################################
# Two-lane actuated traffic-light baselines (ablation 3)
#
# Counterparts of tl<N>veh on tl_intersection_2lane.net.xml, which is the same
# geometry as the consensus two-lane arm with the junction's all-red program
# replaced by an actuated 4-phase plan with protected lefts. Same network for
# both arms, so ablation 3's two-lane comparison isolates the control strategy.
#
# stopDistance is NOT set here, exactly as the one-lane tl<N>veh configs do not
# set it: BaselineModule keeps its own 50 m default. That start-line asymmetry
# against the consensus arm is a known, documented defect of ablation 3 (see
# docs/ablations.md); it is carried over unchanged rather than silently fixed on
# one arm only, which would make the one-lane and two-lane baselines
# incomparable with each other.
##########################################################

[Config tl4veh2lane]
description = "Actuated two-lane traffic light on 4-vehicle routes"
*.manager.launchConfig = xmldoc("tl_4veh_2lane.launchd.xml")
*.node[*].applType = "src.BaselineModule"
*.node[*].appl.sendBeacons = false
*.node[*].appl.dataOnSch = false
*.node[*].appl.intersectionX = 300m
*.node[*].appl.intersectionY = 300m
*.manager.intersectionBatchSize = 4

