<?xml version="1.0" encoding="UTF-8"?>
<configuration xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:noNamespaceSchemaLocation="http://sumo.dlr.de/xsd/sumoConfiguration.xsd">
    <input>
        <net-file value="bft_intersection.net.xml"/>
        <route-files value="bft_12veh_mixed.rou.xml"/>
    </input>
    <time>
        <begin value="0"/>
        <end value="300"/>
        <step-length value="0.1"/>
    </time>
    <processing>
        <collision.check-junctions value="true"/>
        <!-- Preserve post-release physical outcomes; never remove/reinsert a
             vehicle after a junction collision or prolonged blockage. -->
        <collision.action value="none"/>
        <time-to-teleport value="-1"/>
    </processing>
    <report>
        <xml-validation value="never"/>
        <xml-validation.net value="never"/>
        <no-step-log value="true"/>
    </report>
    <gui_only>
        <start value="true"/>
        <quit-on-end value="true"/>
    </gui_only>
</configuration>
