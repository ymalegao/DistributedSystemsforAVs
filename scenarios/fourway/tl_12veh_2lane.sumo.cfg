<?xml version="1.0" encoding="UTF-8"?>
<configuration xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:noNamespaceSchemaLocation="http://sumo.dlr.de/xsd/sumoConfiguration.xsd">
    <input>
        <net-file value="tl_intersection_2lane.net.xml"/>
        <route-files value="bft_12veh_2lane_scale.rou.xml"/>
    </input>
    <time>
        <begin value="0"/>
        <end value="300"/>
        <step-length value="0.1"/>
    </time>
    <output>
        <tripinfo-output value="tl_12veh_2lane.tripinfo.xml"/>
        <summary-output value="tl_12veh_2lane.summary.xml"/>
        <statistic-output value="tl_12veh_2lane.statistics.xml"/>
    </output>
    <processing>
        <collision.check-junctions value="true"/>
        <collision.action value="none"/>
        <time-to-teleport value="-1"/>
    </processing>
    <report>
        <xml-validation value="never"/>
        <xml-validation.net value="never"/>
        <no-step-log value="true"/>
    </report>
    <gui_only>
        <start value="true"/>
        <quit-on-end value="true"/>
    </gui_only>
</configuration>
