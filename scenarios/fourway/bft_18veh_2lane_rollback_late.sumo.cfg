<?xml version="1.0" encoding="UTF-8"?>
<configuration xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:noNamespaceSchemaLocation="http://sumo.dlr.de/xsd/sumoConfiguration.xsd">
    <input>
        <net-file value="bft_intersection_2lane.net.xml"/>
        <route-files value="bft_18veh_2lane_rollback_late.rou.xml"/>
    </input>

    <time>
        <begin value="0"/>
        <end value="300"/>
        <step-length value="0.1"/>
    </time>

    <processing>
        <collision.check-junctions value="true"/>
        <!-- Both carried over from the other two-lane fixtures and absent from the
             single-lane rollback cfg. The two-lane arm deliberately batches
             movements that share the junction, so without these SUMO would either
             hard-stop on a detected conflict or teleport a waiting vehicle, and
             either one silently destroys the scenario the protocol is being
             measured on. -->
        <collision.action value="none"/>
        <time-to-teleport value="-1"/>
    </processing>

    <report>
        <xml-validation value="never"/>
        <xml-validation.net value="never"/>
        <no-step-log value="true"/>
    </report>

    <gui_only>
        <start value="true"/>
        <quit-on-end value="true"/>
    </gui_only>
</configuration>
