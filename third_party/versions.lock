# Pinned upstream revisions for the two vendored dependencies.
#
# setup.sh reads this file, clones each upstream at the pinned revision into
# .external/, and applies the matching patch from this directory. Neither tree
# is committed: this repo carries the pins plus the patches instead.
#
# Format: <name> <url> <ref-kind> <ref> <patch>
#
# To move a pin: bump the ref, run setup.sh, fix any patch rejects, then
# regenerate the patch with tools/regen-patches.sh.

