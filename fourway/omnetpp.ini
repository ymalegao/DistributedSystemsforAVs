[General]
scheduler-class = "omnetpp::cRealTimeScheduler"
realtimescheduler-scaling = 0.1
cmdenv-express-mode = false
cmdenv-autoflush = false
cmdenv-status-frequency = 1s
**.cmdenv-log-level = info

image-path = ../../images

network = fourWay

##########################################################
#            Simulation parameters                       #
##########################################################
debug-on-errors = true
print-undisposed = true

sim-time-limit = 50000s

**.scalar-recording = true
**.vector-recording = true

*.playgroundSizeX = 2500m
*.playgroundSizeY = 2500m
*.playgroundSizeZ = 50m


##########################################################
# Annotation parameters                                  #
##########################################################
*.annotations.draw = true

##########################################################
# Obstacle parameters                                    #
##########################################################
# *.obstacles.obstacles = xmldoc("config.xml", "//AnalogueModel[@type='SimpleObstacleShadowing']/obstacles")
*.obstacles.debug = false
##########################################################
#            TraCIScenarioManager parameters             #
##########################################################
*.manager.updateInterval = 0.1s
*.manager.host = "localhost"
*.manager.port = 9999
*.manager.autoShutdown = true
*.manager.launchConfig = xmldoc("osm.launchd.xml")
*.manager.trafficLightModuleType = "org.car2x.veins.nodes.TrafficLight"



*.tls[*].mobility.x = 0
*.tls[*].mobility.y = 0
*.tls[*].mobility.z = 5

*.tls[*].applType = "org.car2x.veins.modules.application.traci.TraCIDemoTrafficLightApp"
*.tls[*].logicType ="org.car2x.veins.modules.world.traci.trafficLight.logics.TraCITrafficLightSimpleLogic"


##########################################################
#                       RSU SETTINGS                     #
#                                                        #
#                                                        #
##########################################################
*.rsu[0].mobility.x = 2000
*.rsu[0].mobility.y = 2000
*.rsu[0].mobility.z = 3

*.rsu[*].applType = "TraCIDemoRSU11p"
*.rsu[*].appl.headerLength = 80 bit
*.rsu[*].appl.sendBeacons = false
*.rsu[*].appl.dataOnSch = false
*.rsu[*].appl.beaconInterval = 1s
*.rsu[*].appl.beaconUserPriority = 7
*.rsu[*].appl.dataUserPriority = 5
*.rsu[*].nic.phy80211p.antennaOffsetZ = 1.5 m

##########################################################
#            11p specific parameters                     #
#                                                        #
#                    NIC-Settings                        #
##########################################################
*.connectionManager.sendDirect = true
*.connectionManager.maxInterfDist = 2600m
*.connectionManager.drawMaxIntfDist = false
*.connectionManagerName = "connectionManager"
*.**.nic.mac1609_4.useServiceChannel = false

*.**.nic.phy80211p.txPower = 20mW

*.**.nic.mac1609_4.txPower = 20mW
*.**.nic.mac1609_4.bitrate = 6Mbps
*.**.nic.phy80211p.minPowerLevel = -110dBm
*.**.nic.mac1609_4.queueSize = 1024

*.**.nic.phy80211p.useNoiseFloor = true
*.**.nic.phy80211p.noiseFloor = -98dBm


*.**.nic.phy80211p.decider = xmldoc("config.xml")
*.**.nic.phy80211p.analogueModels = xmldoc("config.xml")
*.**.nic.phy80211p.usePropagationDelay = true


*.**.nic.phy80211p.antenna = xmldoc("antenna.xml", "/root/Antenna[@id='monopole']")
*.node[*].nic.phy80211p.antennaOffsetY = 1.895 m
*.node[*].nic.phy80211p.antennaOffsetZ = 1.895 m

##########################################################
#                      App Layer                         #
##########################################################
*.node[*].applType = "src.IntersectionApp"
*.node[*].appl.headerLength = 80 bit
*.node[*].appl.sendBeacons = false
*.node[*].appl.dataOnSch = false
*.node[*].appl.beaconInterval = 1s
*.node[*].nic.phy80211p.connectionManagerName = "connectionManager"#                      Mobility                          #
##########################################################
*.node[*].veinsmobility.x = 0
*.node[*].veinsmobility.y = 0
*.node[*].veinsmobility.z = 0
*.node[*].veinsmobility.setHostSpeed = false
*.node[0].veinsmobility.accidentCount = 0
*.node[0].veinsmobility.accidentStart = 73s
*.node[0].veinsmobility.accidentDuration = 50s


[Config Default]

[Config WithBeaconing]
*.rsu[*].appl.sendBeacons = true
*.node[*].appl.sendBeacons = true

[Config WithChannelSwitching]
*.**.nic.mac1609_4.useServiceChannel = false
*.node[*].appl.dataOnSch = false
*.rsu[*].appl.dataOnSch = false
*.node[*].nic.mac1609_4.useServiceChannel = false

*.node[0].appl.gatewayHost = "127.0.0.1"
*.node[0].appl.gatewayPort = 9001
*.node[0].appl.carId = "CAR_0"
*.node[0].appl.direction = "straight"
*.node[0].appl.stopDistance = 50m
*.node[0].appl.intersectionX = 104m  # Adjust to your intersection position
*.node[0].appl.intersectionY = 82m

*.node[1].appl.gatewayHost = "127.0.0.1"
*.node[1].appl.gatewayPort = 9002
*.node[1].appl.carId = "CAR_1"
*.node[1].appl.direction = "right"
*.node[1].appl.stopDistance = 50m
*.node[1].appl.intersectionX = 104m
*.node[1].appl.intersectionY = 82m


*.node[2].appl.gatewayHost = "127.0.0.1"
*.node[2].appl.gatewayPort = 9003
*.node[2].appl.carId = "CAR_2"
*.node[2].appl.direction = "left"
*.node[2].appl.stopDistance = 50m
*.node[2].appl.intersectionX = 104m
*.node[2].appl.intersectionY = 82m


*.node[3].appl.gatewayHost = "127.0.0.1"
*.node[3].appl.gatewayPort = 9004
*.node[3].appl.carId = "CAR_3"
*.node[3].appl.direction = "right"
*.node[3].appl.stopDistance = 50m
*.node[3].appl.intersectionX = 104m
*.node[3].appl.intersectionY = 82m

[Config BFT4Replicas]
# Pure BFT over V2V with 4 static replicas
*.manager.launchConfig = xmldoc("osm.launchd.xml")

# Use V2VProxyModule for BFT consensus
*.node[*].applType = "org.car2x.veins.modules.bftsmart.V2VProxyModule"

# Assign replica IDs (0-3 for 4 nodes)
*.node[0].appl.replicaId = 0
*.node[1].appl.replicaId = 1
*.node[2].appl.replicaId = 2
*.node[3].appl.replicaId = 3

# Intersection parameters
*.node[*].appl.intersectionX = 104m
*.node[*].appl.intersectionY = 82m
*.node[*].appl.stopDistance = 50m

# Enable channel switching for service channel
*.**.nic.mac1609_4.useServiceChannel = true
*.node[*].appl.dataOnSch = true

[Config BFTOverV2V]
extends = WithChannelSwitching

# Use V2VProxyModule instead of IntersectionApp
*.node[*].applType = "org.car2x.veins.modules.bftsmart.V2VProxyModule"

# Assign replica IDs (0-3 for 4 nodes)
*.node[0].appl.replicaId = 0
*.node[1].appl.replicaId = 1
*.node[2].appl.replicaId = 2
*.node[3].appl.replicaId = 3

# Intersection parameters
*.node[*].appl.intersectionX = 104m
*.node[*].appl.intersectionY = 82m
*.node[*].appl.stopDistance = 50m
*.node[*].appl.intersectionWidth = 15m      # ~14.4m intersection box
*.node[*].appl.avgSpeed = 14mps             # From SUMO vType maxSpeed=14 m/s
*.node[*].appl.safetyGap = 1.5s
*.node[*].appl.stopSignTimeoutSec = 10.0s



# Remove IntersectionApp-specific parameters
*.node[*].appl.gatewayHost = ""
*.node[*].appl.gatewayPort = 0
*.node[*].appl.carId = ""
*.node[*].appl.direction = ""
*.connectionManager.pMax = 20mW
*.connectionManager.sat = -89dBm
*.connectionManager.alpha = 2.0
*.connectionManager.carrierFrequency = 5.890e9 Hz  # 5.89 GHz (CCH)
*.node[*].nic.phy80211p.collectCollisionStatistics = true
*.node[*].nic.phy80211p.ccaThreshold = -90dBm
*.node[*].nic.mac1609_4.cwMin = 3
*.node[*].nic.mac1609_4.cwMax = 7


[Config FourVehiclesBFTOverV2V]
extends = BFTOverV2V
description = "BFT test on benchmarking 4-vehicle routes"
*.manager.launchConfig = xmldoc("bft_4veh.launchd.xml")
# Intersection parameters
*.node[*].appl.intersectionX = 300m
*.node[*].appl.intersectionY = 300m
*.node[*].appl.stopDistance = 50m
*.node[2].appl.isByzantine = true
*.node[2].appl.byzantineType = 1   # 1=FALSE_LANE, 2=INVALID_SIG, 3=EQUIVOCATOR
 

[Config EightVehiclesBFTOverV2V]
extends = BFTOverV2V
description = "BFT test on 8-vehicle routes"
*.manager.launchConfig = xmldoc("bft_8veh.launchd.xml")
# Intersection parameters
*.node[*].appl.intersectionX = 300m
*.node[*].appl.intersectionY = 300m
*.node[*].appl.stopDistance = 100m

# Assign replica IDs (0-7 for 8 nodes)
*.node[0].appl.replicaId = 0
*.node[1].appl.replicaId = 1
*.node[2].appl.replicaId = 2
*.node[3].appl.replicaId = 3
*.node[4].appl.replicaId = 4
*.node[5].appl.replicaId = 5
*.node[6].appl.replicaId = 6
*.node[7].appl.replicaId = 7
*.node[*].appl.consensusTimeoutSec = 400s  # 2 minutes for n=16


 



# Same as EightVehiclesBFTOverV2V but veh7 is ambulance (cert + key auto-issued in V2VProxyModule).
[Config EightVehiclesAmbulanceBFT]
extends = EightVehiclesBFTOverV2V
description = "8 vehicles; veh7 auto-issues Emergency_CA cert and signs ARRIVAL_ANNOUNCE"
*.node[*].appl.ambulanceReplicaId = 7

