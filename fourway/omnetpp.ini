# NED node[i] → SUMO vehicle → route → lane:
# node[0]=veh0(rN=N) node[1]=veh1(rS=S) node[2]=veh10(rE=E) node[3]=veh11(rN=N)
# node[4]=veh12(rW=W) node[5]=veh13(rS=S) node[6]=veh14(rE=E) node[7]=veh15(rN=N)
# node[8]=veh2(rW=W) node[9]=veh3(rW=W) node[10]=veh4(rE=E) node[11]=veh5(rE=E)
# node[12]=veh6(rS=S) node[13]=veh7(rW=W) node[14]=veh8(rS=S) node[15]=veh9(rN=N)

*.node[0].appl.intendedLane = "N"
*.node[1].appl.intendedLane = "S"
*.node[2].appl.intendedLane = "E"
*.node[3].appl.intendedLane = "N"
*.node[4].appl.intendedLane = "W"
*.node[5].appl.intendedLane = "S"
*.node[6].appl.intendedLane = "E"
*.node[7].appl.intendedLane = "N"
*.node[8].appl.intendedLane = "S"
*.node[9].appl.intendedLane = "W"
*.node[10].appl.intendedLane = "E"
*.node[11].appl.intendedLane = "N"
*.node[12].appl.intendedLane = "W"
*.node[13].appl.intendedLane = "W"
*.node[14].appl.intendedLane = "E"
*.node[15].appl.intendedLane = "E"
*.node[16].appl.intendedLane = "S"
*.node[17].appl.intendedLane = "W"
*.node[18].appl.intendedLane = "S"
*.node[19].appl.intendedLane = "N"

# ── Crypto directory (relative to fourway/ run dir) ───────────────────────────
*.node[*].appl.resdbCryptoDir = "resdb_crypto"

# ── Step-3: radio transport (smoke test off in production) ───────────────────
*.node[*].appl.smokeTestBroadcast = false
*.node[*].appl.useRadioTransport = true

# ── Step-5: cert collection / proposal ───────────────────────────────────────
*.node[*].appl.certCollectionTimeoutSec = 8s
*.node[*].appl.stateAnnounceIntervalSec = 0.1s

# ── Step-5: crossing parameters ──────────────────────────────────────────────
*.node[*].appl.cruiseSpeedMps     = 14.0
*.node[*].appl.safetyGapS         = 1.5
# stopDistance is distance-to-lane-end threshold (TraCI-based); 20m is safe for 14 m/s approach
*.node[*].appl.stopDistance       = 5m
# intendedDirection: S=straight, L=left, R=right (all go straight in fourway)
*.node[*].appl.intendedDirection  = "S"

# Arrival cert protocol timings
*.node[*].appl.stopSignTimeoutSec  = 60s
*.node[*].appl.consensusTimeoutSec = 60s
*.node[*].appl.intersectionX = 300m
*.node[*].appl.intersectionY = 300m
*.node[*].appl.debugCertProtocol = false

*.node[*].appl.enableChannelMetricsCsv = true



# pbftVcTimeoutSec sets the PBFT complaint timer; after this many sim-s the complaint fires VC.
*.node[*].appl.pbftVcTimeoutSec = 8s
