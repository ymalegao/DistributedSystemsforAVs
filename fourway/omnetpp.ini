[Config ResDBBase]
extends = WithChannelSwitching

# Shared ResDB V2V radio/intersection defaults.
*.node[*].applType = "org.car2x.veins.modules.application.resDB.ResDBIntersectionApp"
*.node[*].appl.stopDistance = 5m            # base per-pair spacing; effective zone = 5 * (n/2)
*.node[*].appl.totalVehicles = 4            # default; overridden per scenario
*.node[*].appl.intersectionWidth = 15m      # ~14.4m intersection box
*.node[*].appl.avgSpeed = 14mps             # From SUMO vType maxSpeed=14 m/s
*.node[*].appl.safetyGap = 1.5s
*.node[*].appl.stopSignTimeoutSec = 10.0s



# Remove IntersectionApp-specific parameters inherited from WithChannelSwitching.
*.node[*].appl.gatewayHost = ""
*.node[*].appl.gatewayPort = 0
*.node[*].appl.carId = ""
*.node[*].appl.direction = ""
*.connectionManager.pMax = 20mW
*.connectionManager.sat = -89dBm
*.connectionManager.alpha = 2.0
*.connectionManager.carrierFrequency = 5.890e9 Hz  # 5.89 GHz (CCH)
*.node[*].nic.phy80211p.collectCollisionStatistics = true
*.node[*].nic.phy80211p.ccaThreshold = -90dBm
*.node[*].nic.mac1609_4.cwMin = 3
*.node[*].nic.mac1609_4.cwMax = 15

[Config FourVehiclesResDB]
extends = ResDBBase
*.manager.launchConfig = xmldoc("resdb_bft_4veh.launchd.xml")
*.node[*].appl.totalVehicles = 4            # effective stop zone = 5 * 2 = 10m
*.manager.intersectionBatchSize = 4
# ── Per-replica identity (0-based, matches ResDB node1..4 after +1 offset) ───
*.node[0].appl.replicaId = 0
*.node[1].appl.replicaId = 1
*.node[2].appl.replicaId = 2
*.node[3].appl.replicaId = 3

# ── Crypto directory (relative to fourway/ run dir) ───────────────────────────
*.node[*].appl.resdbCryptoDir = "resdb_crypto"

# ── Step-3: radio transport (smoke test off in production) ───────────────────
*.node[*].appl.smokeTestBroadcast = false
*.node[*].appl.useRadioTransport = true

# ── Step-5: cert collection / proposal ───────────────────────────────────────
*.node[*].appl.certCollectionTimeoutSec = 8s
*.node[*].appl.stateAnnounceIntervalSec = 0.1s

# ── Step-5: crossing parameters ──────────────────────────────────────────────
*.node[*].appl.cruiseSpeedMps     = 14.0
*.node[*].appl.safetyGapS         = 1.5
# stopDistance is distance-to-lane-end threshold (TraCI-based); 20m is safe for 14 m/s approach
*.node[*].appl.stopDistance       = 5m
# intendedDirection: S=straight, L=left, R=right (all go straight in fourway)
*.node[*].appl.intendedDirection  = "S"
# intendedLane: explicit cardinal lane per node so batch packer uses correct lane,
# regardless of SUMO edge-name format (reversed edges, junction internals, etc.).
*.node[0].appl.intendedLane = "N"
*.node[1].appl.intendedLane = "S"
*.node[2].appl.intendedLane = "E"
*.node[3].appl.intendedLane = "W"
# Arrival cert protocol timings
*.node[*].appl.stopSignTimeoutSec  = 30s
*.node[*].appl.consensusTimeoutSec = 30s
*.node[*].appl.intersectionX = 300m
*.node[*].appl.intersectionY = 300m
*.node[*].appl.debugCertProtocol = true
*.node[*].appl.enableChannelMetricsCsv = true

*.node[*].appl.enableDecisionGossip              = true
*.node[*].appl.decisionGossipInitialIntervalSec  = 0.5s
*.node[*].appl.decisionGossipMaxRetries          = 5





