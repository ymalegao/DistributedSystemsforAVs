[Config EighteenVehiclesResDB]
extends = SixteenVehiclesResDB
# 18-node identity overlay used by the generated rollback_late_emergency.ini.
# Scenario-specific R0 supervisor, launch, quorum, and rollback tuning lives in
# run-resdb-simulation.sh so the runner owns the experiment knobs.

# Replica IDs for the two late arrivals. The SUMO identity binding only overrides ids
# < totalVehicles, so veh16/veh17 keep these NED ids (valid because they spawn last,
# making node index == veh number).
*.node[16].appl.replicaId = 16
*.node[17].appl.replicaId = 17

# node-index -> SUMO veh -> lane mapping for the 18-vehicle route.
# node[0..15] are inherited from SixteenVehiclesResDB and remain correct because
# the veh->lane assignment is identical; only the two late arrivals are added:
#   node[16] = veh16 (rN, normal), node[17] = veh17 (rE, ambulance)
*.node[16].appl.intendedLane = "N"
*.node[17].appl.intendedLane = "E"



[Config TwentyVehiclesResDB]
extends = ResDBBase
*.manager.launchConfig = xmldoc("resdb_bft_20veh.launchd.xml")
*.node[*].appl.totalVehicles = 20            # effective stop zone = 5 * 4 = 20m
*.manager.intersectionBatchSize = 20
*.intersection[*].appl.orderDelayGap = 0.0s

# Post-consensus gossip: stragglers apply decided order after f+1 signed votes.
*.node[*].appl.enableDecisionGossip              = true
*.node[*].appl.decisionGossipInitialIntervalSec  = 0.5s
*.node[*].appl.decisionGossipMaxRetries          = 5

# Assign replica IDs (0-19 for 20 nodes)
*.node[0].appl.replicaId = 0
*.node[1].appl.replicaId = 1
*.node[2].appl.replicaId = 2
*.node[3].appl.replicaId = 3
*.node[4].appl.replicaId = 4
*.node[5].appl.replicaId = 5
*.node[6].appl.replicaId = 6
*.node[7].appl.replicaId = 7
*.node[8].appl.replicaId = 8
*.node[9].appl.replicaId = 9
*.node[10].appl.replicaId = 10
*.node[11].appl.replicaId = 11
*.node[12].appl.replicaId = 12
*.node[13].appl.replicaId = 13
*.node[14].appl.replicaId = 14
*.node[15].appl.replicaId = 15
*.node[16].appl.replicaId = 16
*.node[17].appl.replicaId = 17
*.node[18].appl.replicaId = 18
*.node[19].appl.replicaId = 19

# SUMO spawns vehicles in alphabetical string order: veh0,veh1,veh10,veh11,...,veh9
# NED node[i] → SUMO vehicle → route → lane:
# node[0]=veh0(rN=N) node[1]=veh1(rS=S) node[2]=veh10(rE=E) node[3]=veh11(rN=N)
# node[4]=veh12(rW=W) node[5]=veh13(rS=S) node[6]=veh14(rE=E) node[7]=veh15(rN=N)
# node[8]=veh2(rW=W) node[9]=veh3(rW=W) node[10]=veh4(rE=E) node[11]=veh5(rE=E)
# node[12]=veh6(rS=S) node[13]=veh7(rW=W) node[14]=veh8(rS=S) node[15]=veh9(rN=N)

*.node[0].appl.intendedLane = "N"
*.node[1].appl.intendedLane = "S"
*.node[2].appl.intendedLane = "E"
*.node[3].appl.intendedLane = "N"
*.node[4].appl.intendedLane = "W"
*.node[5].appl.intendedLane = "S"
*.node[6].appl.intendedLane = "E"
*.node[7].appl.intendedLane = "N"
*.node[8].appl.intendedLane = "S"
*.node[9].appl.intendedLane = "W"
*.node[10].appl.intendedLane = "E"
*.node[11].appl.intendedLane = "N"
*.node[12].appl.intendedLane = "W"
*.node[13].appl.intendedLane = "W"
*.node[14].appl.intendedLane = "E"
*.node[15].appl.intendedLane = "E"
*.node[16].appl.intendedLane = "S"
*.node[17].appl.intendedLane = "W"
*.node[18].appl.intendedLane = "S"
*.node[19].appl.intendedLane = "N"

# ── Crypto directory (relative to fourway/ run dir) ───────────────────────────
*.node[*].appl.resdbCryptoDir = "resdb_crypto"

# ── Step-3: radio transport (smoke test off in production) ───────────────────
*.node[*].appl.smokeTestBroadcast = false
*.node[*].appl.useRadioTransport = true

# ── Step-5: cert collection / proposal ───────────────────────────────────────
*.node[*].appl.certCollectionTimeoutSec = 8s
*.node[*].appl.stateAnnounceIntervalSec = 0.1s

# ── Step-5: crossing parameters ──────────────────────────────────────────────
*.node[*].appl.cruiseSpeedMps     = 14.0
*.node[*].appl.safetyGapS         = 1.5
# stopDistance is distance-to-lane-end threshold (TraCI-based); 20m is safe for 14 m/s approach
*.node[*].appl.stopDistance       = 5m
# intendedDirection: S=straight, L=left, R=right (all go straight in fourway)
*.node[*].appl.intendedDirection  = "S"

# Arrival cert protocol timings
*.node[*].appl.stopSignTimeoutSec  = 60s
*.node[*].appl.consensusTimeoutSec = 60s
*.node[*].appl.intersectionX = 300m
*.node[*].appl.intersectionY = 300m
*.node[*].appl.debugCertProtocol = false

*.node[*].appl.enableChannelMetricsCsv = true



# pbftVcTimeoutSec sets the PBFT complaint timer; after this many sim-s the complaint fires VC.
*.node[*].appl.pbftVcTimeoutSec = 8s

[Config EighteenVehFourUnitsRollback]
extends = EighteenVehiclesResDB
# ── 18-vehicle late-emergency rollback (scenario 15) WITH 4 static intersection units ──
# 18 vehicles (veh0..17, incl. late veh16 normal + veh17 ambulance) + 4 units
# (iu0..3, replicaId 18..21). N=22. Units are permanent PBFT members: they vote in the
# normal ORDER, in CANCEL, and in the recovery ORDER(e+1) via the forced views, but never
# cross. Self-contained (mirrors run-resdb-simulation.sh --rollback-late-emergency).
*.manager.launchConfig = xmldoc("resdb_bft_18veh_rollback_late.launchd.xml")
*.manager.intersectionBatchSize = 16
*.manager.enableR0Supervisor = true
*.manager.r0SpawnAfterCleared = 1
*.manager.lateEmergencyDeltaSec = 0s
*.manager.r0LateSpawnDepartPos = 200m
*.manager.r0LateSpawnRetrySec = 0.2s
*.manager.r0LateSpawnMaxRetries = 25
*.manager.r0LateNormalVehicleId = "veh16"
*.manager.r0LateNormalType = "car"
*.manager.r0LateNormalRoute = "rN"
*.manager.r0LateEmergencyVehicleId = "veh17"
*.manager.r0LateEmergencyType = "ambulance"
*.manager.r0LateEmergencyRoute = "rE"

# consensus + rollback params (BOTH vehicles and units)
*.node[*].appl.totalVehicles = 16
*.iu[*].appl.totalVehicles   = 16
*.node[*].appl.toleratedFaults = 5
*.iu[*].appl.toleratedFaults   = 5
*.node[*].appl.rollbackFaultMode = "per_epoch"
*.iu[*].appl.rollbackFaultMode   = "per_epoch"
*.node[*].appl.ambulanceReplicaId = 17
*.node[*].appl.enableRollback = true
*.iu[*].appl.enableRollback   = true
*.node[*].appl.enableAmbulanceCertGate = true
*.node[*].appl.cancelEchoTimeoutSec = 1s
*.iu[*].appl.cancelEchoTimeoutSec   = 1s
*.node[*].appl.cancelCertRetryIntervalSec = 0.1s
*.iu[*].appl.cancelCertRetryIntervalSec   = 0.1s
*.node[*].appl.cancelCertRetryMax = 20
*.iu[*].appl.cancelCertRetryMax   = 20
*.node[*].appl.rollbackVcTimeoutSec = 8s
*.iu[*].appl.rollbackVcTimeoutSec   = 8s
*.node[*].appl.brakingDecelMps2 = 4.5
*.node[*].appl.processingLatencyMargin = 2.0

# membership: N = 22 (18 vehicles + 4 units), 22-node crypto
fourWay.numIntersectionUnits = 4
*.node[*].appl.totalReplicas = 22
*.iu[*].appl.totalReplicas   = 22
*.node[*].appl.intersectionUnitCount = 4
*.iu[*].appl.intersectionUnitCount   = 4
*.node[*].appl.resdbCryptoDir = "resdb_crypto_rb_units"
*.iu[*].appl.resdbCryptoDir   = "resdb_crypto_rb_units"

# intersection unit app
*.iu[*].applType                = "org.car2x.veins.modules.application.resDB.ResDBIntersectionApp"
*.iu[*].appl.isIntersectionUnit = true
*.iu[*].appl.useRadioTransport  = true
*.iu[*].appl.enableDecisionGossip = true
*.iu[*].appl.sendBeacons        = false
*.iu[*].appl.dataOnSch          = false
*.iu[*].nic.phy80211p.ccaThreshold = -90dBm
*.iu[*].nic.mac1609_4.cwMin        = 3
*.iu[*].nic.mac1609_4.cwMax        = 15
*.iu[0].appl.replicaId = 18
*.iu[1].appl.replicaId = 19
*.iu[2].appl.replicaId = 20
*.iu[3].appl.replicaId = 21
*.iu[0].mobility.x = 305
*.iu[0].mobility.y = 305
*.iu[0].mobility.z = 3
*.iu[1].mobility.x = 345
*.iu[1].mobility.y = 305
*.iu[1].mobility.z = 3
*.iu[2].mobility.x = 305
*.iu[2].mobility.y = 345
*.iu[2].mobility.z = 3
*.iu[3].mobility.x = 345
*.iu[3].mobility.y = 345
*.iu[3].mobility.z = 3

# ── SPEED: fast channel (no obstacle shadowing) so 22 nodes are watchable in Qtenv ──
# Drops SimpleObstacleShadowing + VehicleObstacleShadowing (the per-vehicle "checking
# vehicle in proximity" flood that dominated wall-clock). Keeps path loss + fading.
# (Buildings still load for drawing from the base config, but no longer shadow signals.)
*.**.nic.phy80211p.analogueModels = xmldoc("config_fast.xml")
