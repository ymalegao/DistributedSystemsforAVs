
[Config FourVehiclesAmbulanceBFT]
extends = FourVehiclesBFTOverV2V
description = "4 vehicles; veh3 auto-issues Emergency_CA cert (ambulanceReplicaId matches SUMO veh id, not node index)"
#*.node[*].appl.ambulanceReplicaId = 3
#*.node[0].appl.isByzantine = true
#*.node[0].appl.byzantineType = 1   # 1=FALSE_LANE, 2=INVALID_SIG, 3=EQUIVOCATOR
*.manager.intersectionBatchSize = 4


# ── Ambulance scenario: node[1] (S lane) is ambulance ────────────────────────
# Expected: batch 0 = {veh1(S-amb), veh0(N)} [NS+SS safe], batch 1 = {veh2(E), veh3(W)} [ES+WS safe]
[Config BFTOverV2VWithResilientDBAmb]
extends = BFTOverV2VWithResilientDB
description = "ResDB 4-vehicle; veh1 (S lane) is ambulance — 2 batches expected"
*.node[*].appl.ambulanceReplicaId = 1

# ── Batch crossing scenario: N+S batch 0, E+W batch 1 ────────────────────────
[Config BFTOverV2VWithResilientDBBatch]
extends = BFTOverV2VWithResilientDB
description = "ResDB 4-vehicle; ConflictMatrix batches N+S and E+W — 2 batches expected"

# ── Byzantine follower: node[3] (W lane) ────────────────────────────────────
[Config BFTOverV2VWithResilientDBByz]
extends = BFTOverV2VWithResilientDB
description = "ResDB 4-vehicle; node[3] (W lane) Byzantine — honest N=4 consensus must still complete"
# Change byzantineType to test different fault types:
#   1=FALSE_LANE  2=INVALID_SIG  3=EQUIVOCATOR
*.node[3].appl.isByzantine   = true
*.node[3].appl.byzantineType = 1

# ── Byzantine primary: node[0] (N lane) — view-change test ───────────────────
[Config BFTOverV2VWithResilientDBByzPrimary]
extends = BFTOverV2VWithResilientDB
description = "ResDB 4-vehicle; node[0] (N lane, primary) is silent — VC must elect node[1] as new primary"
# SILENT_PRIMARY (4): primary skips proposeAll(); followers force VC after pbftVcTimeoutSec.
*.node[0].appl.isByzantine    = true
*.node[0].appl.byzantineType  = 4
# Followers trigger VC 3 s after their certCollectionTimeoutSec (2 s) fires = ~5 s total.
*.node[*].appl.pbftVcTimeoutSec = 3s

# ── Byzantine primary: BAD_PROPOSAL variant ───────────────────────────────────
[Config BFTOverV2VWithResilientDBByzPrimaryBadProp]
extends = BFTOverV2VWithResilientDB
description = "ResDB 4-vehicle; node[0] sends malformed proposals (n_vehicles+1) — PreVerify rejects; VC fires via complaint timer"
# BAD_PROPOSAL (5): primary sends proposal with wrong n_vehicles; PreVerify rejects every time.
*.node[0].appl.isByzantine    = true
*.node[0].appl.byzantineType  = 5
# pbftVcTimeoutSec sets the PBFT complaint timer; after this many sim-s the complaint fires VC.
*.node[*].appl.pbftVcTimeoutSec = 3s






# Same as EightVehiclesBFTOverV2V but veh7 is ambulance (cert + key auto-issued in V2VProxyModule).
[Config EightVehiclesAmbulanceBFT]
extends = EightVehiclesBFTOverV2V
description = "8 vehicles; veh7 auto-issues Emergency_CA cert and signs ARRIVAL_ANNOUNCE"
#*.node[*].appl.ambulanceReplicaId = 7
*.manager.intersectionBatchSize = 8
*.node[*].appl.stopSignTimeoutSec = 25s


[Config TwelveVehiclesAmbulanceBFT]
