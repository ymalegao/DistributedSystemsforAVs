# ─────────────────────────────────────────────────────────────────────────────
# Scaling study: 4 / 8 / 12 / 16 vehicles, with and without RSU units.
#
# OFF sections fix a crypto-dir bug: the base N-vehicle configs point at
# resdb_crypto (server.config lists only 4 replicas), so the bridge's PreVerify
# rejects any proposal with n_vehicles>4 ("vehicle count out of range") and no
# ORDER ever commits. Each OFF section repoints to a correctly-sized dir.
#
# ON sections add 4 static intersection units (one per lane), mirroring
# FourVehiclesFourUnitsResDB: N = vehicles + 4, units vote/witness/execute but
# never propose. Unit replicaIds follow the vehicles; crypto dir sized to N.
#
# 4-veh cells use the existing FourVehiclesResDB / FourVehiclesFourUnitsResDB.
# Pass with:  -f omnetpp.ini -f scaling_study.ini -c <ScaleOff8|ScaleOn8|...>
# ─────────────────────────────────────────────────────────────────────────────

# ── OFF arm (no units) — crypto-dir fix only ─────────────────────────────────
[Config ScaleOff8]
extends = EightVehiclesResDB
*.node[*].appl.resdbCryptoDir = "resdb_crypto_8"

[Config ScaleOff12]
extends = TwelveVehiclesResDB
*.node[*].appl.resdbCryptoDir = "resdb_crypto_12"

[Config ScaleOff16]
extends = SixteenVehiclesResDB
*.node[*].appl.resdbCryptoDir = "resdb_crypto_16"

# ── ON arm (+4 units) ────────────────────────────────────────────────────────
# Shared unit-app block is repeated per config because iu[*] replicaIds and the
# crypto dir differ. Placement (4 corners) is visual-only (maxInterfDist covers all).

[Config ScaleOn8]
extends = EightVehiclesResDB
fourWay.numIntersectionUnits = 4
*.node[*].appl.totalReplicas = 12
*.iu[*].appl.totalReplicas   = 12
*.node[*].appl.intersectionUnitCount = 4
*.iu[*].appl.intersectionUnitCount   = 4
*.node[*].appl.resdbCryptoDir = "resdb_crypto_12"
*.iu[*].applType                = "org.car2x.veins.modules.application.resDB.ResDBIntersectionApp"
*.iu[*].appl.isIntersectionUnit = true
*.iu[*].appl.totalVehicles      = 8
*.iu[*].appl.useRadioTransport  = true
*.iu[*].appl.resdbCryptoDir     = "resdb_crypto_12"
*.iu[*].appl.enableDecisionGossip = true
*.iu[*].appl.sendBeacons        = false
*.iu[*].appl.dataOnSch          = false
*.iu[*].nic.phy80211p.ccaThreshold = -90dBm
*.iu[*].nic.mac1609_4.cwMin        = 3
*.iu[*].nic.mac1609_4.cwMax        = 15
*.iu[0].appl.replicaId = 8
*.iu[1].appl.replicaId = 9
*.iu[2].appl.replicaId = 10
*.iu[3].appl.replicaId = 11
*.iu[0].mobility.x = 305
*.iu[0].mobility.y = 305
*.iu[0].mobility.z = 3
*.iu[1].mobility.x = 345
*.iu[1].mobility.y = 305
*.iu[1].mobility.z = 3
*.iu[2].mobility.x = 305
*.iu[2].mobility.y = 345
*.iu[2].mobility.z = 3
*.iu[3].mobility.x = 345
*.iu[3].mobility.y = 345
*.iu[3].mobility.z = 3

